<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>రావులమ్మ ఫుడ్ డెలివరీ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f4f4; color: #222; padding-bottom: 120px; }
    .header { background: #8b0000; color: white; padding: 18px 12px; text-align: center; border-bottom: 3px solid #ffcc00; }
    .header h2 { font-size: 24px; margin-bottom: 6px; }
    .header p { font-size: 14px; margin-top: 4px; }
    .banner { background: #d2691e; color: white; padding: 10px; text-align: center; font-size: 15px; font-weight: bold; border-bottom: 2px solid #8b0000; }
    .item-list { padding: 12px; }
    .item { background: white; border: 2px solid #8b0000; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .item-name { font-size: 17px; font-weight: bold; color: #8b0000; margin-bottom: 4px; }
    .item-price { font-size: 15px; font-weight: bold; color: #333; }
    .qty-controls { display: flex; align-items: center; background: #e8f5e9; border: 2px solid #28a745; border-radius: 8px; overflow: hidden; }
    .btn { background: #28a745; color: white; border: none; width: 38px; height: 38px; font-size: 20px; font-weight: bold; cursor: pointer; }
    .qty-count { width: 38px; text-align: center; font-weight: bold; color: #1e7e34; font-size: 16px; }
    .cart-section { background: white; margin: 12px; padding: 16px; border-radius: 10px; border: 2px solid #8b0000; box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
    .cart-section h3 { font-size: 18px; color: #8b0000; border-bottom: 2px dashed #8b0000; padding-bottom: 8px; margin-bottom: 12px; text-align: center; }
    .cart-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #ddd; font-size: 15px; }
    .cart-name { font-weight: bold; color: #333; flex: 1; }
    .cart-controls { display: flex; align-items: center; gap: 8px; }
    .cart-qty-box { display: flex; align-items: center; border: 1px solid #28a745; border-radius: 6px; overflow: hidden; background: #e8f5e9; }
    .cart-btn { background: #28a745; color: white; border: none; width: 30px; height: 30px; font-size: 18px; font-weight: bold; cursor: pointer; }
    .cart-num { width: 30px; text-align: center; font-weight: bold; font-size: 15px; color: #1e7e34; }
    .cart-cost { font-weight: bold; color: #8b0000; min-width: 55px; text-align: right; }
    .total-row { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 2px solid #8b0000; font-weight: bold; font-size: 18px; }
    .addr-box { margin-top: 14px; }
    .addr-box label { display: block; font-weight: bold; margin-bottom: 5px; color: #8b0000; font-size: 14px; }
    .addr-box input, .addr-box textarea { width: 100%; padding: 10px; border: 2px solid #8b0000; border-radius: 6px; font-size: 15px; margin-bottom: 10px; }
    .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #8b0000; box-shadow: 0 -3px 10px rgba(0,0,0,0.15); }
    .bar-total { font-size: 18px; font-weight: bold; color: #8b0000; }
    .whatsapp-btn { background: #25D366; color: white; border: 2px solid #128C7E; padding: 12px 18px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .whatsapp-btn:disabled { background: #ccc; border-color: #999; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="header">
    <h2>రావులమ్మ ఫుడ్ డెలివరీ</h2>
    <p>శాంతి నగర్ 10వ రోడ్డు, స్టేట్ బ్యాంక్ ఎదురుగా, ఏలూరు - 534007</p>
    <p>కాంటాక్ట్ & వాట్సాప్: 8340830533</p>
  </div>
  <div class="banner">2 కి.మీ లోపు హోమ్ డెలివరీ ఛార్జ్ కేవలం ₹20 మాత్రమే</div>

  <div class="item-list" id="menuList"></div>

  <div class="cart-section" id="cartSection" style="display: none;">
    <h3>మీ ఆర్డర్ కార్ట్ వివరాలు</h3>
    <div id="cartDetails"></div>
    <div class="cart-row" style="border-bottom: none; margin-top: 6px;">
      <span style="font-weight: bold;">డెలివరీ ఛార్జ్:</span>
      <span style="font-weight: bold;">₹20</span>
    </div>
    <div class="total-row">
      <span>మొత్తం చెల్లించాల్సిన బిల్లు:</span>
      <span id="finalBill" style="color: #8b0000;">₹0</span>
    </div>

    <div class="addr-box">
      <label>మీ పేరు & ఫోన్ నంబర్:</label>
      <input type="text" id="custPhone" placeholder="మీ పేరు మరియు ఫోన్ నంబర్ రాయండి">
      <label>మీ పూర్తి డెలివరీ అడ్రస్:</label>
      <textarea id="custAddress" rows="2" placeholder="ఇంటి నంబర్, వీధి, ల్యాండ్ మార్క్ రాయండి..."></textarea>
    </div>
  </div>

  <div class="footer-bar">
    <div class="bar-total" id="barTotal">మొత్తం: ₹0</div>
    <button class="whatsapp-btn" id="orderButton" disabled onclick="sendToWhatsApp()">వాట్సాప్ లో ఆర్డర్ పెట్టండి</button>
  </div>

  <script>
    const HOTEL_WHATSAPP = "918340830533";
    const DELIVERY_FEE = 20;

    const items = [
      { id: 1, name: "1. ఆపాలు", price: 40 },
      { id: 2, name: "2. ఇడ్లీ", price: 40 },
      { id: 3, name: "3. ఎగ్ దోశ", price: 60 },
      { id: 4, name: "4. పరోటా", price: 60 },
      { id: 5, name: "5. చపాతీ", price: 50 },
      { id: 6, name: "6. ఎగ్ పరోటా", price: 80 },
      { id: 7, name: "7. ఊతప్పం", price: 60 },
      { id: 8, name: "8. ఆమ్లెట్ (డబుల్ ఎగ్)", price: 40 },
      { id: 9, name: "9. సాదా దోశ", price: 40 },
      { id: 10, name: "10. ఉల్లి దోశ", price: 50 },
      { id: 11, name: "11. మసాలా దోశ", price: 50 },
      { id: 12, name: "12. కారం దోశ", price: 50 },
      { id: 13, name: "13. డబుల్ ఎగ్ దోశ", price: 70 },
      { id: 14, name: "14. సింగిల్ ఆమ్లెట్", price: 25 }
    ];

    let cart = {};

    function renderMenu() {
      const container = document.getElementById("menuList");
      container.innerHTML = items.map(item => `
        <div class="item">
          <div>
            <div class="item-name">${item.name}</div>
            <div class="item-price">ధర: ₹${item.price}</div>
          </div>
          <div class="qty-controls">
            <button class="btn" onclick="updateQty(${item.id}, -1)">-</button>
            <div class="qty-count" id="qty-${item.id}">${cart[item.id] || 0}</div>
            <button class="btn" onclick="updateQty(${item.id}, 1)">+</button>
          </div>
        </div>
      `).join("");
    }

    function updateQty(id, change) {
      const current = cart[id] || 0;
      const updated = current + change;
      if (updated <= 0) {
        delete cart[id];
        const el = document.getElementById("qty-" + id);
        if (el) el.innerText = "0";
      } else {
        cart[id] = updated;
        const el = document.getElementById("qty-" + id);
        if (el) el.innerText = updated;
      }
      updateCartDisplay();
    }

    function updateCartDisplay() {
      const keys = Object.keys(cart);
      const cartSection = document.getElementById("cartSection");
      const cartDetails = document.getElementById("cartDetails");
      const orderBtn = document.getElementById("orderButton");
      const barTotal = document.getElementById("barTotal");
      const finalBill = document.getElementById("finalBill");

      if (keys.length === 0) {
        cartSection.style.display = "none";
        orderBtn.disabled = true;
        barTotal.innerText = "మొత్తం: ₹0";
        return;
      }

      cartSection.style.display = "block";
      orderBtn.disabled = false;

      let itemTotal = 0;
      let html = "";

      keys.forEach(key => {
        const item = items.find(i => i.id == key);
        const qty = cart[key];
        const cost = item.price * qty;
        itemTotal += cost;
        html += `
          <div class="cart-row">
            <div class="cart-name">${item.name}</div>
            <div class="cart-controls">
              <div class="cart-qty-box">
                <button class="cart-btn" onclick="updateQty(${item.id}, -1)">-</button>
                <div class="cart-num">${qty}</div>
                <button class="cart-btn" onclick="updateQty(${item.id}, 1)">+</button>
              </div>
              <div class="cart-cost">₹${cost}</div>
            </div>
          </div>
        `;
      });

      cartDetails.innerHTML = html;
      const grandTotal = itemTotal + DELIVERY_FEE;
      finalBill.innerText = "₹" + grandTotal;
      barTotal.innerText = "మొత్తం: ₹" + grandTotal;
    }

    function sendToWhatsApp() {
      const phone = document.getElementById("custPhone").value.trim();
      const addr = document.getElementById("custAddress").value.trim();

      let orderText = "*రావులమ్మ ఫుడ్ డెలివరీ - కొత్త ఆర్డర్*%0A----------------------------%0A";
      let itemTotal = 0;

      Object.keys(cart).forEach(key => {
        const item = items.find(i => i.id == key);
        const qty = cart[key];
        const cost = item.price * qty;
        itemTotal += cost;
        orderText += "• " + item.name + " x " + qty + " = ₹" + cost + "%0A";
      });

      const grandTotal = itemTotal + DELIVERY_FEE;
      orderText += "----------------------------%0A";
      orderText += "ఐటమ్స్ బిల్లు: ₹" + itemTotal + "%0A";
      orderText += "డెలివరీ ఛార్జ్: ₹" + DELIVERY_FEE + "%0A";
      orderText += "*మొత్తం బిల్లు: ₹" + grandTotal + "*%0A----------------------------%0A";
      if (phone) orderText += "కస్టమర్ వివరాలు: " + phone + "%0A";
      orderText += "డెలివరీ అడ్రస్: " + (addr ? addr : "అడ్రస్ రాయలేదు");

      window.location.href = "https://wa.me/" + HOTEL_WHATSAPP + "?text=" + orderText;
    }

    renderMenu();
  </script>
</body>
</html>
